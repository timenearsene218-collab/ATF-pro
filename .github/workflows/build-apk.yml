name: Build ATF Pro APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Extraire le projet ATF Pro
        run: |
          mkdir build-project
          unzip -q ATF_Pro_ANDROID_PROJECT.zip -d build-project

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les composants Android
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Construire APK
        working-directory: build-project
        run: gradle assembleDebug --no-daemon

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: ATF-Pro-APK
          path: build-project/app/build/outputs/apk/debug/app-debug.apk
